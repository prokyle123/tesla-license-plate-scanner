<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">TeslaCam Plate and Object Detection Dashboard Preview</title>
  <desc id="desc">Synthetic dashboard preview with status cards, chart, recent sightings, and no real plate data.</desc>
  <defs>
