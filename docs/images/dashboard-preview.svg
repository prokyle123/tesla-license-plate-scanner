    <rect x="178" y="776" width="106" height="57" rx="8" fill="#ede9fe"/><path d="M181 814l30-20 17 12 17-22 37 31v18h-101z" fill="#c4b5fd"/><rect x="313" y="791" width="84" height="27" rx="8" fill="#f1edff"/><text x="355" y="809" text-anchor="middle" class="t chip" fill="#6d28d9">DEMO-17Q</text><text x="464" y="808" class="t table">Today · 5:16 PM</text><text x="632" y="808" class="t table">Front</text><rect x="788" y="791" width="48" height="26" rx="13" fill="#fff7df"/><text x="812" y="809" text-anchor="middle" class="t chip" fill="#b45309">64%</text>
