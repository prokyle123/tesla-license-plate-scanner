<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Tesla License Plate Scanner dashboard preview</title>
  <desc id="desc">Synthetic light-mode preview based on the dashboard's real overview layout, including the icon rail, search bar, scan button, KPI cards, detection chart, live scanner, and review tables.</desc>
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif}.muted{fill:#64748b}.dark{fill:#0f172a}.thin{stroke:#e5e7eb}.small{font-size:13px}.med{font-size:15px}.title{font-size:28px;font-weight:700}.cardtitle{font-size:17px;font-weight:700}.kpi{font-size:34px;font-weight:700}.grid{stroke:#e7ecf5;stroke-width:1}.line{fill:none;stroke:#6d28d9;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#6d28d9;stroke:#fff;stroke-width:3}.pill{font-size:12px;font-weight:700}.tableh{font-size:12px;font-weight:700;fill:#64748b}.table{font-size:14px;fill:#334155}.chip{font-size:12px;font-weight:700}.icon{fill:#64748b}.active{fill:#6d28d9}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f3f5fb"/>
  <rect x="18" y="18" width="1564" height="944" rx="20" fill="#f8fafc" stroke="#e5e7eb"/>
