  <rect x="39" y="42" width="44" height="44" rx="14" fill="url(#logo)"/>
  <text x="61" y="71" text-anchor="middle" class="t" font-size="20" font-weight="800" fill="#fff">T</text>
  <g>
    <rect x="31" y="116" width="60" height="60" rx="16" fill="#f2edff" stroke="#d8c8ff"/>
    <rect x="53" y="137" width="16" height="16" rx="4" fill="#6d28d9"/>
