    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1400" height="780" fill="url(#bg)"/>
  <rect x="28" y="28" width="250" height="724" rx="22" fill="#0a1324" stroke="#2b3a59"/>
